<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Appraiser</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#ece4d2; --wall-lo:#ddd2ba;
    --ink:#241d16; --ink-soft:#6a5f4d;
    --frame:#2b2016; --mat:#f6efdd;
    --brass:#a8792b; --gold:#a8792b; --sage:#4c7450; --ox:#9a3b2f;
    --dim:#8c8069; --card:#fbf5e6;
    --line:#2b201622;
    --disp:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --body:'EB Garamond',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font:19px/1.55 var(--body);color:var(--ink);min-height:100vh;padding:24px 22px 48px;
    background:
      radial-gradient(120% 80% at 50% -10%, #fff6e4 0%, transparent 55%),
      radial-gradient(140% 120% at 50% 120%, #00000018 0%, transparent 60%),
      linear-gradient(180deg,var(--wall),var(--wall-lo));
    background-attachment:fixed;}
  h1{font:600 42px/1.1 var(--disp);margin:0 0 5px;letter-spacing:.3px}
  h2{font:600 15px/1 var(--disp);text-transform:uppercase;letter-spacing:2.5px;margin:0 0 11px;
    color:var(--brass);display:flex;align-items:center;gap:12px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .centre h2{justify-content:center}
  .centre h2::before{content:"";flex:1;height:1px;background:var(--line)}
  .sub{color:var(--ink-soft);margin:0 0 18px;font:italic 400 18px/1.5 var(--body)}
  .wrap{max-width:1340px;margin:0 auto}
  #app{animation:fade .3s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  .hud{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
    padding:12px 22px;background:linear-gradient(180deg,#fdf8ec,#f3ead2);
    border:1px solid var(--frame);border-radius:3px;box-shadow:0 2px 0 #0000000f,0 10px 24px -18px #000;
    font-size:15px}
  .hud .h-wall{font:600 20px var(--disp);letter-spacing:.5px}
  .hud .h-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-right:6px}
  .hud .rep{color:var(--ox);letter-spacing:3px;font-size:19px}
  .hud .scr{color:var(--brass);font-weight:600;letter-spacing:2px;font-size:17px}
  .hud .coin{color:var(--ink)}
  .hud .mod{color:var(--frame);font-style:italic}
  .hud .seed{color:var(--dim);font-style:italic;margin-left:auto}
  .hud .hudbtns{display:flex;gap:6px}

  .bench{border:1px solid var(--frame);border-radius:3px;padding:15px 17px;margin-bottom:20px;
    background:linear-gradient(180deg,#fdf8ec,#f2e7cd);box-shadow:0 2px 0 #0000000f,0 10px 24px -20px #000}
  .bench-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:13px}
  .bench-title{font:600 15px var(--disp);text-transform:uppercase;letter-spacing:2.5px;color:var(--brass)}
  .scr-meter{font-size:14px;color:var(--ink-soft);letter-spacing:3px}
  .scr-meter .scr-num{color:var(--brass);font-weight:600;font-size:18px;letter-spacing:0;margin:0 4px}
  .tools{display:flex;gap:10px;flex-wrap:wrap}
  .tool{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:124px;
    padding:9px 13px;border:1px solid var(--frame);border-radius:3px;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,#fff,#f2e8cf);color:var(--ink);
    transition:transform .1s,box-shadow .12s,background .12s}
  .tool:hover:not(:disabled){background:#fff;box-shadow:0 5px 14px -6px #0007;transform:translateY(-1px)}
  .tool:disabled{opacity:.35;cursor:not-allowed}
  .tool.arm{background:linear-gradient(180deg,#c39235,var(--brass));border-color:var(--brass);color:#fff;
    box-shadow:0 0 0 3px #a8792b33}
  .tool.arm .tool-tag{color:#fff2d8}
  .tool-name{font:600 15px var(--disp);letter-spacing:.2px}
  .tool-tag{font:600 9.5px var(--body);text-transform:uppercase;letter-spacing:1.2px;color:var(--dim)}
  .bench-staff{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-soft)}
  .bench-staff b{color:var(--ink);font-weight:600;cursor:help;border-bottom:1px dotted var(--dim)}
  .arm-hint{display:inline-block;margin-top:11px;font:italic 500 15px var(--body);color:var(--brass);
    background:#a8792b1a;padding:5px 12px;border-radius:14px}
  .appraise-note{font:italic 400 13px var(--body);color:var(--dim)}

  .tip{position:absolute;z-index:2000;max-width:280px;background:var(--frame);color:var(--mat);
    padding:12px 14px;border-radius:4px;box-shadow:0 14px 34px -8px #000c;pointer-events:none;display:none}
  .tip b{display:block;font:600 15px var(--disp);margin-bottom:5px;color:#fff}
  .tip span{display:block;font:400 13.5px/1.45 var(--body)}
  .kw{border-bottom:1px dotted currentColor;cursor:help}
  .painting .claim .kw{border-bottom-color:var(--brass)}
  .notes .kw{border-bottom-color:var(--dim)}

  .layout{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .main{flex:1 1 640px;min-width:340px}
  .side{flex:0 1 320px;min-width:280px}

  .rail{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
    padding:34px 14px 26px;border-radius:3px;margin-bottom:8px;
    background:linear-gradient(180deg,#0000 0,#00000010 100%),
      repeating-linear-gradient(90deg,#0000 0 56px,#00000008 56px 58px);
    border-top:5px solid var(--frame);
    box-shadow:0 14px 26px -20px #000 inset, 0 -1px 0 #fff6 inset;
    scrollbar-width:thin;cursor:grab}
  .rail:active{cursor:grabbing}
  .rail-track{display:flex;gap:16px;align-items:flex-start;width:max-content;margin:0 auto}
  .zoombar{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:13px;color:var(--dim)}
  .zoombar button{width:26px;height:26px;border:1px solid var(--frame);background:linear-gradient(180deg,#fdf8ec,#f0e5cb);
    color:var(--ink);border-radius:3px;cursor:pointer;font:600 15px var(--body);line-height:1}
  .zoombar button:hover{background:#fff}
  .zoombar .zhint{font-style:italic}
  .slot{width:190px;min-height:284px;border:1px dashed #00000033;border-radius:2px;
    display:flex;align-items:flex-start;justify-content:center;position:relative;
    background:#00000008;transition:border-color .12s,background .12s}
  .slot .n{position:absolute;top:-22px;left:2px;font:11px/1 var(--body);text-transform:uppercase;
    letter-spacing:1.5px;color:var(--dim)}
  .slot.hover{border-color:var(--brass);border-style:solid;background:#a8792b1f;box-shadow:0 0 0 2px #a8792b33}

  .roomgrp{display:flex;flex-direction:column;gap:26px}
  .roomlbl{font:600 13px var(--disp);text-transform:uppercase;letter-spacing:3px;color:var(--brass);
    text-align:center;padding:3px 10px;background:#a8792b1a;border-radius:12px;align-self:center}
  .roomslots{display:flex;gap:16px;flex-wrap:nowrap}
  .wallgrid{display:grid;gap:16px;justify-content:center}
  .doorway{align-self:center;display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--frame);opacity:.55;padding:0 8px}
  .doorway::before{content:"";width:18px;height:100px;border:2px solid currentColor;border-bottom:0;
    border-radius:18px 18px 0 0}
  .doorway::after{content:"doorway";font:10px/1 var(--body);text-transform:uppercase;letter-spacing:1.5px}

  .tray{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:150px;
    padding:16px 12px;border:1px dashed #00000026;border-radius:3px;background:#00000006}
  .tray-h{font:600 13px var(--disp);text-transform:uppercase;letter-spacing:3px;color:var(--dim);
    text-align:center;margin:10px 0 4px}

  .painting{width:190px;background:linear-gradient(160deg,#3a2c1e,#241a11);padding:7px;border-radius:2px;
    box-shadow:0 8px 20px -8px #000a, 0 0 0 1px #0006;position:relative;cursor:grab;
    touch-action:none;user-select:none;transition:transform .12s,box-shadow .15s}
  .painting:hover{transform:translateY(-3px);box-shadow:0 16px 30px -10px #000b,0 0 0 1px #0006}
  .painting.target{outline:3px solid var(--brass);outline-offset:3px;cursor:pointer;
    box-shadow:0 0 0 6px #a8792b22, 0 8px 20px -8px #000a}
  .painting.notarget{opacity:.35;filter:grayscale(.6);pointer-events:none}
  .painting.picked{outline:3px solid var(--sage);outline-offset:3px;box-shadow:0 0 0 6px #4c745022,0 8px 20px -8px #000a}
  .painting.accused{box-shadow:0 0 0 3px var(--ox),0 10px 24px -10px #000b}
  .painting:active{cursor:grabbing}
  .painting .art{height:134px;border:5px solid var(--mat);box-shadow:0 0 0 1px #0004 inset;overflow:hidden;background-size:cover;background-position:center}
  .painting .art img{width:100%;height:100%;object-fit:cover;display:block}
  .painting .meta{background:var(--mat);color:var(--ink);padding:6px 7px 5px;margin-top:6px;text-align:center}
  .painting .meta b{display:block;font:600 14.5px/1.15 var(--disp)}
  .painting .meta .who{color:var(--ink-soft);font:italic 400 11.5px var(--body)}
  .painting .claim{font:400 12.5px/1.35 var(--body);background:#efe4c8;color:var(--ink);
    padding:6px 7px;margin-top:6px;border-left:3px solid var(--brass);min-height:46px}
  .painting .claim.none{background:#e4dcc6;color:var(--dim);font-style:italic;border-left-color:#00000022}
  .painting .tag{font:700 11px var(--body);letter-spacing:1px;margin-top:6px;padding:4px 4px;text-align:center;text-transform:uppercase}
  .painting .tag.g{background:var(--sage);color:#fff}
  .painting .tag.f{background:var(--ox);color:#fff}
  .painting .tag.s{background:var(--brass);color:#fff}
  .painting .fmark{width:100%;margin-top:6px;font:700 11px var(--body);letter-spacing:1px;
    padding:6px 4px;text-align:center;text-transform:uppercase;background:var(--ox);color:#fff;border-radius:2px}
  .wall-how{text-align:center;font:italic 400 14px var(--body);color:var(--ink-soft);margin:2px 0 14px}
  .wall-how b{font-style:normal;font-weight:600;color:var(--ink)}
  .tutbox{background:#fdf6e3;border:1px solid var(--frame);border-left:5px solid var(--gold);
    border-radius:3px;padding:13px 16px;margin:0 0 16px;font-size:14.5px;line-height:1.55}
  .tutbox b{font:600 15px var(--disp);color:var(--brass);display:block;margin-bottom:6px;letter-spacing:.3px}
  .tutbox p{margin:0}

  .notes{list-style:none;padding:0;margin:0 0 18px}
  .notes li{background:#fdf7e6;border:1px solid var(--line);border-left:4px solid var(--brass);
    padding:10px 12px;margin:7px 0;font-size:15.5px;line-height:1.42}
  .notes li i{color:var(--ink-soft)}
  .info{font-size:15.5px;color:var(--ink-soft);background:#fdf7e6;padding:13px 15px;
    border:1px solid var(--line);border-radius:2px;margin-bottom:18px;line-height:1.5}
  .log{list-style:none;padding:0;margin:0}
  .log li{font:400 14px/1.4 var(--body);padding:8px 11px;margin:6px 0;background:#2b2016;color:#f1e6cf;
    border-radius:2px;border-left:3px solid var(--brass);animation:fade .25s ease both}
  .log li.warn{background:#4e241d;border-left-color:var(--ox)}

  .bar{text-align:center;margin:20px 0;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button.big{font:500 17px var(--body);padding:11px 26px;border:1px solid var(--frame);
    background:linear-gradient(180deg,#fdf8ec,#f0e5cb);color:var(--ink);cursor:pointer;border-radius:2px;
    transition:transform .1s,background .12s,box-shadow .12s}
  button.big:hover:not(:disabled){background:#fff;box-shadow:0 4px 12px -5px #0007}
  button.big:active:not(:disabled){transform:translateY(1px)}
  button.big:disabled{opacity:.4;cursor:not-allowed}

  .verdict{max-width:760px;margin:18px auto 0;padding:18px 24px;text-align:center;font-size:16.5px;
    border-radius:3px;animation:pop .3s ease both;line-height:1.5}
  .verdict b{font:600 20px var(--disp)}
  .verdict.win{background:linear-gradient(180deg,#5a8a5c,#436b46);color:#fff;box-shadow:0 10px 30px -12px #4c745088}
  .verdict.lose{background:linear-gradient(180deg,#a8463a,#7f2e26);color:#fff;box-shadow:0 10px 30px -12px #9a3b2f88}
  .verdict.hint{background:#f3e8cc;color:var(--ink);border:1px solid var(--brass)}

  .centre{max-width:720px;margin:48px auto;text-align:center}
  .centre input{font:400 17px var(--body);padding:10px 14px;border:1px solid var(--frame);
    border-radius:2px;width:220px;background:var(--card)}
  .seg{display:inline-flex;border:1px solid var(--frame);border-radius:2px;overflow:hidden}
  .seg button{font:500 15.5px var(--body);padding:9px 18px;border:0;border-right:1px solid var(--frame);
    background:var(--card);color:var(--ink);cursor:pointer;transition:background .1s}
  .seg button:last-child{border-right:0}
  .seg button:hover:not(.on){background:#fff}
  .seg button.on{background:var(--frame);color:var(--mat)}

  .choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:18px 0}
  .choice{width:258px;background:var(--card);border:1px solid var(--frame);border-left:4px solid var(--dim);
    padding:17px;cursor:pointer;border-radius:2px;text-align:left;transition:transform .12s,box-shadow .12s,border-color .12s}
  .choice:hover{transform:translateY(-3px);box-shadow:0 14px 26px -12px #0008;border-left-color:var(--brass)}
  .choice.rar-uncommon{border-left-color:var(--brass)}
  .choice.rar-rare{border-left-color:var(--ox)}
  .choice b{display:block;margin-bottom:7px;font:600 18px var(--disp)}
  .choice span{display:block;font-size:14.5px;color:var(--ink-soft);line-height:1.45}
  .choice .rar{display:block;margin-top:10px;font:600 10.5px var(--body);text-transform:uppercase;
    letter-spacing:1.5px;color:var(--dim)}
  .choice.dim{opacity:.3;pointer-events:none}
  .choice button{margin-top:12px;font:500 14px var(--body);padding:6px 16px;border:1px solid var(--frame);
    background:var(--frame);color:var(--mat);cursor:pointer;border-radius:2px}
  .choice button:disabled{opacity:.4;cursor:not-allowed}
  .choice s{font-weight:normal;opacity:.6}

  .kitbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font:500 13.5px var(--body);padding:6px 13px;border:1px solid var(--frame);border-radius:16px;
    background:linear-gradient(180deg,#fdf8ec,#f0e5cb);color:var(--ink)}
  .chip.act{cursor:pointer;transition:background .1s,transform .1s}
  .chip.act:hover{background:#fff;transform:translateY(-1px)}

  .floorplan{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px auto 28px;
    padding:16px;background:#00000010;border:1px solid var(--line);border-radius:3px;max-width:900px}
  .room{width:120px;min-height:118px;border:1px solid var(--frame);border-radius:2px;padding:11px 5px;
    display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--card);
    transition:background .15s,box-shadow .15s}
  .room .g{font-size:26px;opacity:.28;transition:opacity .15s}
  .room .rn{font:600 11px var(--disp);text-transform:uppercase;letter-spacing:.5px;text-align:center;color:var(--ink-soft)}
  .room .dots{font-size:10px;letter-spacing:2px;color:var(--brass)}
  .room.lvl1{background:#f8edd0} .room.lvl1 .g{opacity:.5}
  .room.lvl2{background:#f2e2ba} .room.lvl2 .g{opacity:.75}
  .room.lvl3{background:#ecd6a2;border-color:var(--brass);box-shadow:0 0 0 2px #a8792b33} .room.lvl3 .g{opacity:1}
  .faclist{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  .fac{width:282px;background:var(--card);border:1px solid var(--frame);border-radius:2px;padding:16px;text-align:left}
  .fac-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .fac-h b{font:600 18px var(--disp)}
  .fac-h .dots{font-size:12px;letter-spacing:2px;color:var(--brass)}
  .forkseg{display:flex;width:100%;margin-bottom:10px;border:1px solid var(--frame);border-radius:2px;overflow:hidden}
  .forkseg button{flex:1;font:500 12.5px var(--body);padding:7px 2px;border:0;border-right:1px solid var(--frame);
    background:var(--card);color:var(--ink);cursor:pointer}
  .forkseg button:last-child{border-right:0}
  .forkseg button.on{background:var(--frame);color:var(--mat)}
  .fac-eff{font-size:14px;color:var(--ink-soft);min-height:56px;margin:0 0 10px;line-height:1.45}
  .fac .big{width:100%;font-size:14px;padding:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ============================================================ helpers
let RAND = Math.random;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashSeed(s){ let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return (h^h>>>16)>>>0; }
const rnd = n => Math.floor(RAND()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const clone = o => JSON.parse(JSON.stringify(o));
function permutations(a){ if(a.length<=1) return [a];
  return a.flatMap((x,i)=>permutations([...a.slice(0,i),...a.slice(i+1)]).map(r=>[x,...r])); }
function kcombos(a,k){ if(k===0) return [[]]; if(k>a.length) return [];
  const [h,...t]=a; return [...kcombos(t,k-1).map(c=>[h,...c]), ...kcombos(t,k)]; }

// ============================================================ content
// public-domain works; images hot-linked from Wikimedia thumbnails, with the
// solid colour as an offline / load-failure fallback.
function wthumb(file,w,wiki){
  const host = wiki==="en" ? "en.wikipedia.org" : "commons.wikimedia.org";
  return `https://${host}/wiki/Special:FilePath/${encodeURIComponent(file)}?width=${w}`;
}
// `file` is the Wikimedia file name (Commons unless wiki:"en"); the solid colour
// is the offline / load-failure fallback. Types: landscape · portrait · still-life · abstract.
const _P = [
  {id:"starry",   title:"The Starry Night",            artist:"van Gogh",   year:1889, type:"landscape",  color:"#22406b", file:"Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg"},
  {id:"wave",     title:"The Great Wave off Kanagawa",  artist:"Hokusai",    year:1831, type:"landscape",  color:"#2f6c86", file:"Tsunami_by_hokusai_19th_century.jpg"},
  {id:"redfuji",  title:"Fine Wind, Clear Morning",    artist:"Hokusai",    year:1831, type:"landscape",  color:"#a0492f", file:"Red_Fuji_southern_wind_clear_morning.jpg"},
  {id:"scream",   title:"The Scream",                   artist:"Munch",      year:1893, type:"abstract",   color:"#c8631d", file:"Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg"},
  {id:"madonna",  title:"Madonna",                      artist:"Munch",      year:1894, type:"portrait",   color:"#5a2f38", file:"Edvard_Munch_-_Madonna_-_Google_Art_Project.jpg"},
  {id:"pearl",    title:"Girl with a Pearl Earring",    artist:"Vermeer",    year:1665, type:"portrait",   color:"#2f4d7a", file:"1665_Girl_with_a_Pearl_Earring.jpg"},
  {id:"milkmaid", title:"The Milkmaid",                 artist:"Vermeer",    year:1658, type:"still-life", color:"#b0902f", file:"Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.jpg"},
  {id:"delft",    title:"View of Delft",                artist:"Vermeer",    year:1661, type:"landscape",  color:"#7a888a", file:"Vermeer-view-of-delft.jpg"},
  {id:"astronomer",title:"The Astronomer",              artist:"Vermeer",    year:1668, type:"portrait",   color:"#6a5a37", file:"Johannes_Vermeer_-_The_Astronomer_-_WGA24685.jpg"},
  {id:"square",   title:"Black Square",                 artist:"Malevich",   year:1915, type:"abstract",   color:"#1c1c1c", file:"Kazimir_Malevich,_1915,_Black_Suprematic_Square,_oil_on_linen_canvas,_79.5_x_79.5_cm,_Tretyakov_Gallery,_Moscow.jpg"},
  {id:"stacks",   title:"Stacks of Wheat",              artist:"Monet",      year:1891, type:"landscape",  color:"#c98a34", file:"Claude_Monet_-_Stacks_of_Wheat_(End_of_Summer)_-_1985.1103_-_Art_Institute_of_Chicago.jpg"},

// ============================================================ eval core
const Pmap = arr => new Map(arr.map(p=>[p.id,p]));
// rooms: puz.rooms is an array of room sizes (default: one room spanning the wall).
function roomRanges(puz){
  const sizes = puz.rooms || [puz.N];
  const out=[]; let s=0;
  for(const sz of sizes){ out.push([s, s+sz-1]); s+=sz; }
  return out;
}
function roomOfSlot(i,puz){
  if(!puz.rooms) return 0;
  const r=roomRanges(puz);
  for(let k=0;k<r.length;k++) if(i>=r[k][0] && i<=r[k][1]) return k;
  return 0;
}
const sameRoom = (i,j,puz)=> !puz.rooms || roomOfSlot(i,puz)===roomOfSlot(j,puz);
// puz.grid = {cols, rows}: a 2-D wall. Slots are row-major; adjacency is 4-connected.
function neighbours(i,puz){
  if(puz.grid){
    const {cols,rows}=puz.grid, r=(i/cols)|0, c=i%cols, out=[];
    if(c>0) out.push(i-1);
    if(c<cols-1) out.push(i+1);
    if(r>0) out.push(i-cols);
    if(r<rows-1) out.push(i+cols);
    return out;
  }
  return [i-1,i+1].filter(k=>k>=0 && k<puz.N && sameRoom(i,k,puz));
}
function nbrInDir(i,dir,puz){
  if(puz.grid){
    const {cols,rows}=puz.grid, r=(i/cols)|0, c=i%cols;
    if(dir==="left")  return c>0 ? i-1 : -1;
    if(dir==="right") return c<cols-1 ? i+1 : -1;
    if(dir==="above") return r>0 ? i-cols : -1;
    if(dir==="below") return r<rows-1 ? i+cols : -1;
    return -1;
  }
  const k = dir==="right" ? i+1 : i-1;
  return (k>=0 && k<puz.N && sameRoom(i,k,puz)) ? k : -1;
}
const isCorner = (i,puz)=> puz.grid ? neighbours(i,puz).length===2 : (i===0 || i===puz.N-1);
function bandSlots(axis,idx,puz){                       // grid row or column, as a Set of slot indices
  const {cols}=puz.grid, out=new Set();
  for(let i=0;i<puz.N;i++){ const b = axis==="row" ? (i/cols)|0 : i%cols; if(b===idx) out.add(i); }
  return out;
}
const BAND_ROW=["top row","middle row","bottom row"], BAND_COL=["left column","centre column","right column"];
const bandName=(axis,idx)=> (axis==="row"?BAND_ROW:BAND_COL)[idx] || (axis+" "+(idx+1));
const adjSlot  = (i,j,puz)=> puz.grid ? neighbours(i,puz).includes(j) : (Math.abs(i-j)===1 && sameRoom(i,j,puz));
function resolveClaim(c,order,fg,selfId,puz){
  const P=puz.P, N=puz.N, j=order.indexOf(selfId), me=P.get(selfId);
  switch(c.kind){
    case "onEnd":    return isCorner(j,puz);
    case "notOnEnd": return !isCorner(j,puz);
    case "leftOf":   return j < order.indexOf(c.targetId);
    case "rightOf":  return j > order.indexOf(c.targetId);
    case "adjacentTo": return adjSlot(j, order.indexOf(c.targetId), puz);
    case "neighborArtist":{
      const k = nbrInDir(j, c.dir, puz);
      return k>=0 && P.get(order[k]).artist===c.artist;
    }
    case "neighborType":{
      const k = nbrInDir(j, c.dir, puz);
      return k>=0 && P.get(order[k]).type===c.t;
    }
    case "olderThanNeighbors":
      return neighbours(j,puz).every(k=> me.year < P.get(order[k]).year);
    case "youngerThanNeighbors":
      return neighbours(j,puz).every(k=> me.year > P.get(order[k]).year);
    case "slotForged":  return fg.has(order[c.slot-1]);
    case "slotGenuine": return !fg.has(order[c.slot-1]);
    case "countForgedHere": return fg.size===c.k;
    // --- social: claims about other works' authenticity, by name ---
    case "accuse":   return fg.has(c.targetId);
    case "vouch":    return !fg.has(c.targetId);
    case "sameFate": return fg.has(selfId) === fg.has(c.targetId);
    case "pairOneForged": return fg.has(c.a) !== fg.has(c.b);
    case "neighbourForged": return neighbours(j,puz).some(k=> fg.has(order[k]));
    case "cliqueForged":{ // "exactly N of [these named works] are forgeries"
      let n=0; for(const id of c.ids) if(fg.has(id)) n++; return n===c.n; }
    // --- checkable: facts about the works themselves (year/artist on the card) ---
    case "inBand":{ const {cols}=puz.grid; return c.axis==="row" ? ((j/cols)|0)===c.idx : (j%cols)===c.idx; }
    case "olderThan":    return me.year < P.get(c.targetId).year;
    case "sharesArtist": return me.artist === P.get(c.targetId).artist;
    case "soleArtist":   return [...P.values()].every(q=>q.id===selfId || q.artist!==me.artist);
    case "oldestHere":   return [...P.values()].every(q=> q.id===selfId || q.year >= me.year);
    case "newestHere":   return [...P.values()].every(q=> q.id===selfId || q.year <= me.year);
    case "otherRoomForgeries":{
      const my=roomOfSlot(j,puz); let cnt=0;
      roomRanges(puz).forEach((rg,ri)=>{ if(ri===my) return;
        for(let i=rg[0];i<=rg[1];i++) if(fg.has(order[i])) cnt++; });
      return cnt===c.n;
    }
    case "pastiche":{ const t=P.get(c.targetId);
      return t && t.claim ? resolveClaim(t.claim,order,fg,selfId,puz) : true; }
  }
  return false;
}
function testRule(r,order,fg,puz){
  const P=puz.P, N=puz.N;
  const adjPairs = f=>{
    for(let i=0;i<N;i++) for(const k of neighbours(i,puz))
      if(k>i && f(order[i],order[k],i)) return true;
    return false;
  };
  switch(r.kind){
    case "countForged": return fg.size===r.n;
    case "typeAtEnd":   return P.get(order[0]).type===r.t || P.get(order[N-1]).type===r.t;
    case "leftmostType":  return P.get(order[0]).type===r.t;
    case "rightmostType": return P.get(order[N-1]).type===r.t;
    case "artistNotAdjacent": return !adjPairs((a,b)=>P.get(a).artist===r.artist && P.get(b).artist===r.artist);
    case "typeNotAdjacent":   return !adjPairs((a,b)=>P.get(a).type===r.t && P.get(b).type===r.t);
    case "orderPair":    return order.indexOf(r.a) < order.indexOf(r.b);
    case "adjacentPair": return adjSlot(order.indexOf(r.a), order.indexOf(r.b), puz);
    case "inHalf":{
      const i=order.indexOf(r.id);
      return r.half==="left" ? i < Math.floor(N/2) : i >= Math.ceil(N/2);
    }
    case "bandForgeries":{                              // grid: a whole row or column
      const {cols}=puz.grid; let c=0;
      for(let i=0;i<N;i++){ const b = r.axis==="row" ? (i/cols)|0 : i%cols;
        if(b===r.idx && fg.has(order[i])) c++; }
      return c===r.n; }
    case "roomForgeries":{
      const rg=roomRanges(puz)[r.room]; let c=0;
      for(let i=rg[0];i<=rg[1];i++) if(fg.has(order[i])) c++;
      return c===r.n;
    }
  }
  return false;
}
function evalWorld(puz,order,fg){
  for(let i=0;i<puz.N;i++){
    const p=puz.P.get(order[i]);
    if(!p.claim) continue;                              // unattributed: no testimony
    const truth=resolveClaim(p.claim,order,fg,order[i],puz);
    if(p.nature==="masterforger"){ if(!truth) return false; }  // a perfect fake — its placard reads true
    else if(truth === fg.has(order[i])) return false;          // genuine ⇔ placard true
  }
  for(const r of puz.rules) if(!testRule(r,order,fg,puz)) return false;
  return true;
}
function solve(puz,limit){
  const ids=[...puz.P.keys()], out=[];
  const fgSets = kcombos(ids,puz.forgeryCount);
  for(const order of permutations(ids))
    for(const combo of fgSets){
      if(evalWorld(puz,order,new Set(combo))){ out.push({order:order.slice(),forged:combo.slice()});
        if(out.length>limit) return out; }
    }
  return out;
}

// ---- propagation solver: solves ONLY by forced moves, never guessing.
// Used as a fairness gate — a wall ships only if pure logic cracks it.
function range(n){ return Array.from({length:n},(_,i)=>i); }
function propSolve(puz, givenNat, givenPos, ignoreClaims){
  const ids=[...puz.P.keys()], N=puz.N, F=puz.forgeryCount;
  const pos={}, nat={};
  ids.forEach(w=>{ pos[w]=new Set(range(N)); nat[w]=new Set(["g","f"]); });
  if(givenNat) for(const w in givenNat) if(nat[w]) nat[w]=new Set([givenNat[w]]);
  if(givenPos) for(const w in givenPos) if(pos[w]) pos[w]=new Set([givenPos[w]]);
  const dead=()=> ids.some(w=>pos[w].size===0||nat[w].size===0);
  const slotOf=w=> pos[w].size===1 ? [...pos[w]][0] : -1;
  const rangeOf=w=>{ const a=[...pos[w]]; return [Math.min(...a),Math.max(...a)]; };
  const ownerOf=k=>{ const c=ids.filter(w=>pos[w].has(k)); return c.length===1 ? c[0] : null; };

  const setNat=(w,v)=>{ if(nat[w].size===1) return false; nat[w]=new Set(nat[w].has(v)?[v]:[]); return true; };

  const cornerSet = puz.grid
    ? new Set([0, puz.grid.cols-1, N-puz.grid.cols, N-1])
    : new Set([0, N-1]);

    switch(c.kind){
      case "onEnd":{ const s=[...pos[w]], on=s.some(x=>cornerSet.has(x)), off=s.some(x=>!cornerSet.has(x));
        return on&&!off?"T":(!on?"F":"?"); }
      case "notOnEnd":{ const r=claimStatus({kind:"onEnd"},w); return r==="T"?"F":r==="F"?"T":"?"; }
      case "leftOf":{ const [aL,aH]=rangeOf(w),[bL,bH]=rangeOf(c.targetId); return aH<bL?"T":aL>=bH?"F":"?"; }
      case "rightOf":{ const [aL,aH]=rangeOf(w),[bL,bH]=rangeOf(c.targetId); return aL>bH?"T":aH<=bL?"F":"?"; }
      case "adjacentTo":{ const a=slotOf(w),b=slotOf(c.targetId);
        if(a>=0&&b>=0) return adjSlot(a,b,puz)?"T":"F";
        if(puz.grid) return "?";
        const [aL,aH]=rangeOf(w),[bL,bH]=rangeOf(c.targetId);
        return (aH+1<bL||bH+1<aL)?"F":"?"; }

        const j=slotOf(w); if(j<0) return "?";

        const o=ownerOf(k); if(!o) return "?";
        return (c.kind==="neighborArtist"?puz.P.get(o).artist===c.artist:puz.P.get(o).type===c.t)?"T":"F"; }
      case "olderThanNeighbors": case "youngerThanNeighbors":{
        const j=slotOf(w); if(j<0) return "?";
        const me=puz.P.get(w).year; let unknown=false, ok=true;

  for(let attempt=0; attempt<maxAttempts; attempt++){
    const arr = shuffle(spec.works || POOL).slice(0,spec.n).map(clone);
    const P=Pmap(arr), N=spec.n;
    const puz={P,N,forgeryCount:spec.f,rules:[],
               rooms: (spec.rooms && spec.rooms.reduce((a,b)=>a+b,0)===N) ? spec.rooms : null,
               grid: (spec.grid && spec.grid.cols*spec.grid.rows===N) ? spec.grid : null,
               fixed: !!spec.fixed};
    const order=shuffle(arr.map(p=>p.id));
    const forged=new Set(shuffle(order).slice(0,spec.f));
    const mute=new Set(shuffle(order).slice(0,spec.u));            // unattributed works
    const master=new Set(shuffle([...forged]).slice(0, Math.min(spec.mf||0, spec.f)));  // master forgers

    for(const p of arr){
      if(mute.has(p.id)){ p.claim=null; p.claimText=null; p.nature="unattributed"; continue; }
      const mf=master.has(p.id);
      p.nature = mf ? "masterforger" : "attributed";
      const desired = mf ? true : !forged.has(p.id);              // genuine ⇒ true; master forger ⇒ true
      p.claim = genClaim(p,order,forged,arr,puz,desired);
      p.claimText = claimText(p.claim,P,puz);
    }
    if(spec.pa){                                                  // pastiche: a work that reuses another's wording
      const cand=arr.filter(p=>p.nature==="attributed" && !mute.has(p.id));
      for(const p of shuffle(cand).slice(0,spec.pa)){
        const want=!forged.has(p.id);
        const tgts=arr.filter(q=>q.id!==p.id && q.claim && q.nature==="attributed"
          && q.claim.targetId!==p.id                                // avoid "left of myself"
          && resolveClaim(q.claim,order,forged,p.id,puz)===want);   // q's wording, read at p's spot
        if(!tgts.length) continue;
        const t=pick(tgts);
        p.nature="pastiche";
        p.claim={kind:"pastiche", targetId:t.id, echo:t.claimText};
        p.claimText=claimText(p.claim,P,puz);
      }
    }
    puz.rules=[{kind:"countForged",n:spec.f}];
    // budget is Scrutiny, not fact count (fairReveals is Scrutiny-weighted now).
    let budget = 5 + (spec.f>=2?2:0) + (spec.rooms||spec.grid?1:0)
      + Math.min(3, (spec.f>=3?1:0) + (spec.mf?2:0) + (spec.pa?1:0));
    if(spec.fixed) budget = Math.min(budget, 7);   // a pre-hung wall is nature-only — every reveal a 2-cost Authenticate

    if(spec.fixed){
      // the curator has already hung the wall — the whole puzzle is "which are fake".
      // positions are given; we only need the forgery set to be pinned by pure logic
      // plus a few reveals. No brute solve() — fairReveals uses propSolve, fast at any n.
      puz.paintings=arr; puz.solution={order:order.slice(), forged:[...forged]}; puz.spec=spec;
      const boardPos={}; order.forEach((id,i)=>boardPos[id]=i);
      for(let g=0; g<40; g++){
        const fr=fairReveals(puz,null,boardPos);
        if(fr>=(spec.min||1) && fr<=budget) break;
        if(fr<(spec.min||1) || fr===0) break;             // too easy — abandon this layout
        if(puz.rules.length>=6) break;
        for(let t=0;t<20;t++){ const cand=genRule(order,forged,arr,puz);
          if(testRule(cand,order,forged,puz)){ puz.rules.push(cand); break; } }
      }
      const fr=fairReveals(puz,null,boardPos);
      if(fr < (spec.min||1) || fr > budget) continue;
      if(fairReveals(puz,null,boardPos,true) <= budget) continue;   // placards must carry it
      puz.rules.forEach(r=>r.text=ruleText(r,P));
      return puz;
    }

    let sols=solve(puz,240);
    if(sols.length>240) continue;                 // target too loose — try a fresh layout
    let guard=0;
    const noteCap = spec.rooms ? 6 : 4;              // fewer Curator's Notes ⇒ placards must carry the puzzle
    while(sols.length!==1 && puz.rules.length<noteCap && guard++<50){
      if(sols.length===0) break;
      const cand=genRule(order,forged,arr,puz);
      if(!testRule(cand,order,forged,puz)) continue;
      const next=sols.filter(s=>testRule(cand,s.order,new Set(s.forged),puz));
      if(next.length>=1 && next.length<sols.length){ puz.rules.push(cand); sols=next; }
    }
    if(sols.length===1){
      puz.paintings=arr; puz.solution=sols[0]; puz.spec=spec;
      // fairness window — a perfect deducer must still BUY between spec.min and
      // `budget` facts. Upper bound keeps it solvable; lower bound (spec.min) stops
      // notes+placards alone from cracking it.
      const fr = fairReveals(puz);
      if(fr > budget || fr < (spec.min||0)) continue;
      // placards must be load-bearing: with the placards ignored, the Curator's
      // Notes + a full reveal budget must NOT be enough to solve. (Only meaningful
      // on n≥5 — a tiny wall's placards carry it regardless.)
      if(N>=5 && fairReveals(puz, null, null, true) <= budget) continue;
      puz.rules.forEach(r=>r.text=ruleText(r,P));
      return puz;
    }
  }
  if(spec.fixed) return makePuzzle({...spec,fixed:false,grid:null,n:Math.min(spec.n,6)}, tries);   // fall back to a normal wall
  if(spec.grid)  return makePuzzle({...spec,grid:null}, tries);
  if(spec.rooms) return makePuzzle({...spec,rooms:null}, tries);
  if(spec.pa>0)  return makePuzzle({...spec,pa:0}, tries);
  if(spec.mf>0)  return makePuzzle({...spec,mf:0}, tries);
  if(spec.u>0)   return makePuzzle({...spec,u:spec.u-1}, tries);
  if(spec.f>1)   return makePuzzle({...spec,f:1}, tries);
  if(spec.min)   return makePuzzle({...spec,min:0}, tries);   // drop the floor before shrinking the wall
  if(spec.n>4)   return makePuzzle({...spec,n:spec.n-1}, tries);
  if(tries<6)    return makePuzzle(spec, tries+1);        // advance RNG, try afresh
  throw new Error("generator exhausted for "+JSON.stringify(spec));
}

function weightedDraw(pool, n){
  pool=pool.slice(); const out=[];
  while(out.length<n && pool.length){
    let tot=pool.reduce((s,x)=>s+RARITY[x.rarity],0), r=RAND()*tot, i=0;
    while(i<pool.length-1 && r>=RARITY[pool[i].rarity]){ r-=RARITY[pool[i].rarity]; i++; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

const escHtml = s => s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function glossify(text){
  const hits=[];
  for(const g of GLOSSARY){ g.re.lastIndex=0; let m;
    while((m=g.re.exec(text))){ hits.push({s:m.index,e:m.index+m[0].length,g});
      if(m.index===g.re.lastIndex) g.re.lastIndex++; } }
  hits.sort((a,b)=> a.s-b.s || (b.e-b.s)-(a.e-a.s));
  let out="", pos=0;
  for(const h of hits){
    if(h.s<pos) continue;
    out += escHtml(text.slice(pos,h.s));
    out += `<span class="kw" data-g="${h.g.key}">${escHtml(text.slice(h.s,h.e))}</span>`;
    pos=h.e;
  }
  return out + escHtml(text.slice(pos));
}
function wireGlossary(root){
  if(!root) return;
  root.querySelectorAll(".kw").forEach(elm=>{
    const g=GLOSSARY.find(x=>x.key===elm.dataset.g);
    if(g) attachTip(elm, g.title, g.def);
  });
}

}

function logLine(text,warn){ fs.log.unshift({text,warn:!!warn}); }

// ============================================================ actions
function move(id,target){
  if(fs.over||fs.arming||fs.puz.fixed) return;
  const from=fs.slots.indexOf(id);
  if(from!==-1) fs.slots[from]=null;
  if(target!==-1){
    const disp=fs.slots[target];
    fs.slots[target]=id;
    if(disp && from!==-1) fs.slots[from]=disp;
  }
  render();
}
function toggleAccuse(id){
  if(fs.over||fs.arming||fs.reveals[id]) return;   // a confirmed work's verdict is fixed to the truth
  fs.accused.has(id)?fs.accused.delete(id):fs.accused.add(id);
  render();
}
function armAction(a, freeItem){
  if(fs.over) return;
  const provFree = a==="provenance" && !freeItem && RUN.upgrades.has("provFree") && !fs.freeProvUsed;
  const authFree = a==="authenticate" && !freeItem && fs.freeAuth>0;
  const firstFree = !freeItem && !provFree && !authFree && RUN.upgrades.has("firstFree") && fs.firstFreeAvail;
  const free = !!freeItem || provFree || authFree || firstFree || DEV.inf;
  if(fs.arming===a){ fs.arming=null; fs.armFree=null; fs._picks=[]; render(); return; }
  if(!free && fs.scrutiny < toolCost(a)) return;
  fs.arming=a; fs.armFree = freeItem || (provFree?"_prov": authFree?"_auth": firstFree?"_first": null); fs._picks=[];
  render();
}
// which works a given tool may be pointed at right now
function targetOK(a, id){
  const hung=fs.slots.includes(id);
  switch(a){
    case "authenticate": return !fs.reveals[id];
    case "survey":       return !fs.reveals[id];         // no point surveying a known work
    case "provenance":   return hung && !fs.puz.fixed;   // fixed wall: every slot is already correct
  }
  return false;
}
function actionTarget(id){

  if(a==="survey"){
    if(fs._picks.length>=surveyMax()) fireTool();
    else render();

  }

  fireTool();
}

  const a=fs.arming, picks=fs._picks.slice(), free=fs.armFree;

}
function resolveAction(a, ids){
  const T=id=>fs.puz.P.get(id).title;

  if(a==="authenticate"){
    const v=solF.has(ids[0])?"f":"g"; fs.reveals[ids[0]]=v; fs.authed.add(ids[0]);
    if(v==="f") fs.accused.add(ids[0]); else fs.accused.delete(ids[0]);   // a known fact sets the call for you

  } else if(a==="survey"){
    const k=ids.filter(id=>solF.has(id)).length;
    logLine(`Survey — of ${ids.map(T).join(", ")}: ${k} ${k===1?"is a forgery":"are forgeries"}.`);

      } else {
        dir = want<cur ? "further left" : "further right";
      }
      logLine(`Provenance — ${T(ids[0])} is in the WRONG slot; it belongs ${dir}.`);
    }
  }

  RUN.shopOpen = RUN.wall%2===0;   // the market runs every other wall (after Walls 2, 4, 6)
  RAND = mulberry32(hashSeed(RUN.seed + "#r" + RUN.wall));
  rollRewards(); rewardTaken=false; screen="reward"; render();
}
function rewardPool(){
  const owned=id=>RUN.actions.includes(id)||RUN.upgrades.has(id)||RUN.staff.includes(id);
  return REWARDS.filter(r=>(r.repeat||!owned(r.id)) && (!r.req||RUN.actions.includes(r.req)));
}
function rollRewards(){
  rewardOffer=weightedDraw(rewardPool(),3);
  shopOffer = RUN.shopOpen ? weightedDraw(CONSUMABLES.slice(),3) : [];
}
function rerollReward(){
  if(rewardTaken || !RUN.rerollsLeft) return;
  RUN.rerollsLeft--;
  RAND = mulberry32(hashSeed(RUN.seed + "#r" + RUN.wall + "." + RUN.rerollsLeft));
  rewardOffer=weightedDraw(rewardPool(),3);   // reroll the tools only, not the shop
  render();
}
function itemPrice(it){ return Math.max(1, Math.round(it.price*(1-RUN.shopDiscount))); }
function takeReward(id){
  if(rewardTaken) return;
  const r=REWARDS.find(x=>x.id===id);
  if(r.type==="action") RUN.actions.push(id);
  else if(r.type==="upgrade"){ RUN.upgrades.add(id);
    if(id==="scrutinyUp"){ RUN.scrutinyBase++; RUN.scrutinyUpCount=(RUN.scrutinyUpCount||0)+1; } }
  else if(r.type==="staff") RUN.staff.push(id);
  rewardTaken=true; rewardMsg=`Taken: ${r.name}.`; render();
}
function skipReward(){ if(rewardTaken) return; RUN.coin+=5; rewardTaken=true; rewardMsg="Skipped — +5 coin."; render(); }
function buyItem(id){
  const it=ITEM(id); if(!it) return;
  const price=DEV.inf ? 0 : itemPrice(it); if(RUN.coin<price) return;
  RUN.coin-=price; RUN.items.push(id);
  shopOffer=shopOffer.filter(x=>x.id!==id);
  render();
}

// ============================================================ pointer drag
let drag=null;
function startDrag(id,ev,fromEl){
  if(fs.over||fs.arming) return;
  if(fs.puz.fixed){ toggleAccuse(id); return; }   // fixed wall: can't move, tap = flag
  drag={id,fromEl,x0:ev.clientX,y0:ev.clientY,ghost:null};
  window.addEventListener("pointermove",moveGhost);
  window.addEventListener("pointerup",endDrag,{once:true});
}
function moveGhost(ev){
  if(!drag) return;
  if(!drag.ghost){
    if(Math.abs(ev.clientX-drag.x0)<6 && Math.abs(ev.clientY-drag.y0)<6) return;   // still a tap
    const g=drag.fromEl.cloneNode(true);
    g.style.cssText="position:fixed;left:0;top:0;width:190px;margin:0;pointer-events:none;opacity:.92;z-index:999;transition:none;transform:rotate(-3deg);box-shadow:0 14px 30px -8px #000a";
    document.body.appendChild(g); drag.ghost=g;
  }
  drag.ghost.style.transform=`translate(${ev.clientX-95}px,${ev.clientY-40}px) rotate(-3deg)`;
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  const slot=el && el.closest("[data-slot]");
  document.querySelectorAll(".slot.hover").forEach(s=>{ if(s!==slot) s.classList.remove("hover"); });
  if(slot) slot.classList.add("hover");
}
function endDrag(ev){
  window.removeEventListener("pointermove",moveGhost);
  document.querySelectorAll(".slot.hover").forEach(s=>s.classList.remove("hover"));
  const d=drag; if(!d) return;
  drag=null;
  if(!d.ghost){ toggleAccuse(d.id); return; }   // a tap, not a drag → mark / unmark forgery
  d.ghost.remove();
  const under=document.elementFromPoint(ev.clientX,ev.clientY);
  const slot=under && under.closest("[data-slot]");
  const tray=under && under.closest("#tray");
  if(slot) move(d.id,+slot.dataset.slot);
  else if(tray) move(d.id,-1);
}

function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function card(p){
  const armed=!!fs.arming && !fs.over;
  const ok = armed && targetOK(fs.arming, p.id);
  const picked=(fs._picks||[]).includes(p.id);
  const rv=fs.reveals[p.id], acc=fs.accused.has(p.id);
  const d=el(`<div class="painting ${ok?"target":""} ${armed&&!ok?"notarget":""} ${picked?"picked":""} ${acc?"accused":""}" data-id="${p.id}">
    <div class="art" style="background:${p.color}">${p.img?`<img src="${p.img}" alt="" draggable="false" onerror="this.remove()">`:""}</div>
    <div class="meta"><b>${p.title}</b><span class="who">${p.artist}, ${p.year} · ${p.type}</span></div>
    <div class="claim ${p.claim?"":"none"}">${p.claim?"&ldquo;"+glossify(p.claimText)+"&rdquo;":glossify("unattributed — no placard")}</div>
    ${rv
      ? `<div class="tag ${rv}">${rv==="f"?"◆ FORGERY — confirmed":"✓ GENUINE — confirmed"}</div>`
      : acc ? `<div class="fmark">◆ marked a forgery</div>` : ""}
  </div>`);
  d.addEventListener("pointerdown",e=>{
    if(e.button||fs.over) return;
    if(armed){ e.preventDefault(); if(ok) actionTarget(p.id); return; }
    e.preventDefault(); startDrag(p.id,e,d);
  });
  wireGlossary(d);
  return d;
}

      const grp=el(`<div class="roomgrp"><div class="roomlbl">Room ${ROOM_LETTER[ri]}</div><div class="roomslots"></div></div>`);
      for(let i=rg[0];i<=rg[1];i++) grp.querySelector(".roomslots").appendChild(slotEl(i));
      track.appendChild(grp);
    });
  } else {
    for(let i=0;i<puz.N;i++) track.appendChild(slotEl(i));
  }
  if(tray) puz.paintings.filter(p=>!fs.slots.includes(p.id)).forEach(p=>tray.appendChild(card(p)));

  // ---- wall zoom + pan
  const applyZoom = ()=>{ track.style.zoom = railZoom; layout.querySelector("#zlbl").textContent = Math.round(railZoom*100)+"%"; };
  applyZoom();
  layout.querySelectorAll(".zoombar button").forEach(b=>b.onclick=()=>{
    railZoom = Math.max(0.6, Math.min(1.3, +(railZoom + (+b.dataset.z)*0.15).toFixed(2)));
    applyZoom();
  });
  rail.addEventListener("wheel", e=>{                       // vertical wheel pans the wall
    if(!e.deltaY || e.shiftKey) return;
    rail.scrollLeft += e.deltaY; e.preventDefault();
  }, {passive:false});
  rail.addEventListener("pointerdown", e=>{                 // drag empty wall space to pan
    if(e.target.closest(".painting")) return;               // let cards handle their own drag
    const x0=e.clientX, s0=rail.scrollLeft; let moved=false;
    const mv=ev=>{ if(Math.abs(ev.clientX-x0)>3) moved=true; rail.scrollLeft = s0-(ev.clientX-x0); };
    const up=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up,{once:true});
  });

  const showReg = RUN.staff.includes("registrar") && placed;
  const hideC = puz.spec.hideCount && !RUN.showHidden;
  let notesHtml = puz.rules
    .filter(r=> !(hideC && r.kind==="countForged"))
    .map(r=>{
      let mk="";
      if(showReg) mk = testRule(r,order,fs.accused,puz)
        ? ' <span style="color:var(--ok)">✓</span>' : ' <span style="color:var(--bad)">✗</span>';
      return `<li>${glossify(r.text)}${mk}</li>`;
    }).join("");
  if(hideC) notesHtml += `<li><i>The number of ${glossify("forgeries")} here is not disclosed.</i></li>`;
  else if(puz.spec.hideCount) notesHtml += `<li><i>Count normally withheld — your Index reveals it above.</i></li>`;
  if(puz.paintings.some(p=>p.nature==="masterforger"))
    notesHtml += `<li><i>${glossify("A master forger hangs here — its placard reads true. Only investigation or contradiction will out it.")}</i></li>`;
  const notesEl=layout.querySelector("#notes"); notesEl.innerHTML = notesHtml; wireGlossary(notesEl);
  const tutEl=layout.querySelector(".tutbox"); if(tutEl) wireGlossary(tutEl);

  const logEl=layout.querySelector("#log");
  logEl.innerHTML = fs.log.length
    ? fs.log.map(l=>`<li class="${l.warn?"warn":""}">${glossify(l.text)}</li>`).join("")
    : `<li style="background:none;color:#8a8072;padding:0">No findings yet.</li>`;
  wireGlossary(logEl);

  const ap=layout.querySelector("#appraise");
  ap.disabled = fs.over || fs.slots.some(x=>!x) || !!fs.arming;
  ap.onclick=appraise;
  const apn=layout.querySelector("#apnote");
  if(!fs.over) apn.textContent = fs.arming ? "finish or cancel the tool first"
    : fs.slots.some(x=>!x) ? "hang every work first"
    : fs.puz.fixed ? "submit — name every forgery, exactly"
    : "submit the wall — placements and forgery calls together";

  if(fs.verdict){
    const vb=layout.querySelector("#verdictbox");
    vb.appendChild(el(`<div class="verdict ${fs.verdict.cls}">${fs.verdict.html}</div>`));
    if(fs.over && fs.result==="win" && RUN.tutorial){
      const last=RUN.tutIdx>=TUTORIAL.length-1;
      const b=el(`<div class="bar"><button class="big" id="cont">${last?"Finish tutorial":"Next lesson"}</button></div>`);
      vb.appendChild(b); b.querySelector("#cont").onclick=tutNext;
    } else if(fs.over && fs.result==="win"){
      const b=el(`<div class="bar"><button class="big" id="cont">${RUN.wall+1>=WALLS.length?"Finish the season":"Continue"}</button></div>`);
      vb.appendChild(b); b.querySelector("#cont").onclick=afterWall;
    } else if(fs.over){
      const b=el(`<div class="bar">
        <button class="big" id="again">New season</button>
        <button class="big" id="replay">Replay seed</button></div>`);
      vb.appendChild(b);
      b.querySelector("#again").onclick=()=>newRun();
      b.querySelector("#replay").onclick=()=>newRun(RUN.seed);
    }
  }
}

// ============================================================ self-check
function selfCheck(){
  const savedSave=JSON.stringify(SAVE), savedCur=chosenCurator, savedStake=chosenStake;
  const rows=[]; RAND=mulberry32(hashSeed("selfcheck"));
  for(let w=0; w<WALLS.length; w++){
    for(let i=0;i<4;i++){
      const t0=performance.now();
      const puz=makePuzzle(WALLS[w]);
      const sol=puz.solution;
      const s=WALLS[w];
      let budget = 5 + (s.f>=2?2:0) + (s.rooms||s.grid?1:0)
        + Math.min(3, (s.f>=3?1:0) + (s.mf?2:0) + (s.pa?1:0));
      if(s.fixed) budget = Math.min(budget, 7);
      const bp = puz.fixed ? (()=>{ const m={}; sol.order.forEach((id,k)=>m[id]=k); return m; })() : null;
      const uniq = puz.fixed
        ? evalWorld(puz,sol.order,new Set(sol.forged))
        : (solve(puz,5).length===1 && evalWorld(puz,sol.order,new Set(sol.forged)));
      const muteOK = puz.paintings.filter(p=>p.nature==="unattributed").every(p=>!p.claim);
      const fr = fairReveals(puz, null, bp);
      console.assert(uniq, `wall ${w+1}: unique+valid`);
      console.assert(muteOK, `wall ${w+1}: unattributed carry no placard`);
      console.assert(fr>=(s.min||0) && fr<=budget, `wall ${w+1}: Scrutiny to solve must be ${s.min||0}..${budget}, is ${fr}`);
      rows.push({wall:w+1, n:puz.N, f:puz.forgeryCount, u:puz.paintings.filter(p=>!p.claim).length,
        layout:puz.grid?`${puz.grid.cols}×${puz.grid.rows}${puz.fixed?" fixed":""}`:(puz.rooms?puz.rooms.join("+"):"row"),
        rules:puz.rules.length, fair:fr, ms:Math.round(performance.now()-t0)});
    }
  }
  // Master Forger (via the Committee stake): when one is present, its placard reads true
  RAND=mulberry32(hashSeed("mf"));
  for(let i=0;i<6;i++){
    const puz=makePuzzle({n:6,f:2,u:1,mf:1});
    const mf=puz.paintings.find(p=>p.nature==="masterforger");
    if(mf){
      const solF=new Set(puz.solution.forged);
      console.assert(solF.has(mf.id), "a master forger must be one of the forgeries");
      console.assert(resolveClaim(mf.claim,puz.solution.order,solF,mf.id,puz),
        "a master forger's placard must read true in the solution");
      console.assert(evalWorld(puz,puz.solution.order,solF), "master-forger wall must validate");
    }
  }
  // Pastiche (via the Circle stake): its placard's truth equals the echoed claim, read at its own spot
  RAND=mulberry32(hashSeed("pa"));
  for(let i=0;i<6;i++){
    const puz=makePuzzle({n:6,f:2,u:1,pa:1});
    const pa=puz.paintings.find(p=>p.nature==="pastiche");
    if(pa){
      const solF=new Set(puz.solution.forged), t=puz.P.get(pa.claim.targetId);
      console.assert(t && t.claim && t.claim.kind!=="pastiche", "a pastiche must quote a real placard");
      console.assert(
        resolveClaim(pa.claim,puz.solution.order,solF,pa.id,puz) ===
        resolveClaim(t.claim,puz.solution.order,solF,pa.id,puz),
        "a pastiche resolves to the echoed claim read at its own position");
      console.assert(evalWorld(puz,puz.solution.order,solF), "pastiche wall must validate");
    }
  }
  // Two-room walls: cross-room works aren't neighbours; room forgery counts add up
  RAND=mulberry32(hashSeed("rooms"));
  for(let i=0;i<6;i++){
    const puz=makePuzzle({n:6,f:2,u:1,rooms:[3,3]});
    if(!puz.rooms) continue;
    const solF=new Set(puz.solution.forged), o=puz.solution.order;
    console.assert(!adjSlot(2,3,puz), "the doorway breaks adjacency between slot 3 and slot 4");
    console.assert(evalWorld(puz,o,solF), "two-room wall must validate");
    const rc=roomRanges(puz).map(rg=>{ let c=0; for(let k=rg[0];k<=rg[1];k++) if(solF.has(o[k])) c++; return c; });
    console.assert(rc[0]+rc[1]===puz.solution.forged.length, "room forgery counts sum to the total");
  }
  // 2-D grid walls: 4-connected adjacency (up/down + left/right), no diagonals
  RAND=mulberry32(hashSeed("grid"));
  let gridsMade=0;
  for(let i=0;i<14;i++){
    const puz=makePuzzle({n:4,f:1,u:1,grid:{cols:2,rows:2},min:2});
    if(!puz.grid) continue;
    gridsMade++;
    const solF=new Set(puz.solution.forged), o=puz.solution.order;
    console.assert(evalWorld(puz,o,solF), "grid wall must validate");
    console.assert(adjSlot(0,1,puz) && adjSlot(0,2,puz), "2x2: slot 0 touches slot 1 (right) and slot 2 (below)");
    console.assert(!adjSlot(0,3,puz) && !adjSlot(1,2,puz), "2x2: no diagonal adjacency");
    console.assert(neighbours(0,puz).length===2, "2x2: every slot is a corner (2 neighbours)");
    console.assert(fairReveals(puz) >= 2, "grid wall still needs investigation");
  }
  console.assert(gridsMade>=6, "grid walls generate reliably — "+gridsMade+"/14");

  // fixed walls: a pre-hung 3×3, solved purely by which placards lie
  RAND=mulberry32(hashSeed("fixed"));
  let fixedMade=0, fixedT=0;
  for(let i=0;i<10;i++){
    const t0=performance.now();
    let puz; try{ puz=makePuzzle(WALLS[WALLS.length-1]); }catch(e){ continue; }
    fixedT=Math.max(fixedT, performance.now()-t0);
    if(!puz.fixed || puz.N!==9) continue;
    fixedMade++;
    const solF=new Set(puz.solution.forged), o=puz.solution.order;
    console.assert(evalWorld(puz,o,solF), "fixed 3×3 must validate in its canonical board");
    const bp={}; o.forEach((id,i)=>bp[id]=i);
    const fr=fairReveals(puz,null,bp);
    console.assert(fr>=4 && fr<=7, "fixed wall: 4–7 Scrutiny to solve with the board known, got "+fr);
    console.assert(fairReveals(puz,null,bp,true)>7, "fixed wall: notes alone can't name the fakes");
  }
  console.assert(fixedMade>=5, "fixed 3×3 walls generate — "+fixedMade+"/10");
  console.assert(fixedT<900, "fixed 3×3 generation stays under ~900ms — "+Math.round(fixedT));

  RAND=mulberry32(hashSeed("abc")); const a=makePuzzle(WALLS[4]);
  RAND=mulberry32(hashSeed("abc")); const b=makePuzzle(WALLS[4]);
  console.assert(JSON.stringify(a.solution)===JSON.stringify(b.solution), "seed determinism");

  // a seed's walls must not shift when the museum changes
  const wallSig=(seed,idx,facs)=>{
    SAVE={v:1,patronage:0,facilities:facs,bestWall:0,curator:"standard",known:[]}; chosenCurator="standard";
    RAND=mulberry32(hashSeed(seed));
    RUN={ seed, wall:idx, rep:4,repMax:4,coin:0,scrutinyBase:4,actions:["authenticate","survey","provenance"],
          upgrades:new Set(),staff:[],items:[],deck:shuffle(POOL),deckPos:0,patronMult:1,apprGrace:0,hintCharges:0,
          freeAuthPerWall:0,shopDiscount:0,catCap:1,rerollsPerShop:0,notesConfirm:0,showHidden:false };
    applyFacilities(); enterWall();
    return fs.puz.paintings.map(p=>p.id+(p.claim?p.claim.kind:"·")).join()+"|"+JSON.stringify(fs.puz.solution);
  };
  console.assert(
    wallSig("detA",3,{}) === wallSig("detA",3,{reception:{level:3,fork:"alt"},guidebook:{level:3,fork:"basic"},members:{level:2,fork:"alt"}}),
    "same seed+wall must generate the same puzzle regardless of facilities");

  // meta: save round-trips
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1,patronage:77,facilities:{cafe:{level:2,fork:"basic"}},bestWall:3}));
    const rt=loadSave();
    console.assert(rt.patronage===77 && rt.facilities.cafe.level===2, "save round-trips");
  }catch(e){ console.log("localStorage unavailable — skipping save test"); }

  // meta: a facility effect actually reaches RUN
  SAVE={v:1,patronage:0,facilities:{cafe:{level:2,fork:"basic"},security:{level:1,fork:"alt"}},bestWall:0};
  chosenCurator="standard";
  RUN={seed:"x",wall:0,rep:4,repMax:4,coin:0,scrutinyBase:3,actions:[],upgrades:new Set(),staff:[],
       items:[],deck:[],deckPos:0,patronMult:1,apprGrace:0,hintCharges:0,freeAuthPerWall:0,
       shopDiscount:0,catCap:1,rerollsPerShop:0,notesConfirm:0,showHidden:false};
  applyFacilities();
  console.assert(RUN.scrutinyBase===5, "Café L2/basic → +2 base Scrutiny, got "+RUN.scrutinyBase);
  console.assert(RUN.hintCharges===1, "Security L1/alt → 1 hint charge, got "+RUN.hintCharges);

  const sim = simRun();
  console.assert(sim.over, "sim run should clear all walls");
  console.assert(sim.coin>0, "clearing walls should pay coin — "+sim.coin);
  console.assert(sim.patronage>0, "a scoring run should bank Patronage — "+sim.patronage);
  console.assert(sim.bestWall===WALLS.length, "bestWall should reach the finale — "+sim.bestWall);
  console.assert(sim.noRepeats, "no artwork may repeat within a run — saw "+sim.worksSeen+" placements");

  // a practice run (chosen seed) must bank nothing
  SAVE=defaultSave(); chosenCurator="standard";
  newRun("practicecheck");
  console.assert(RUN.practice, "a typed seed makes the run practice");
  const p0=SAVE.patronage, b0=SAVE.bestWall;
  while(screen!=="over"){
    if(screen==="wall" && !fs.over){ const s=fs.puz.solution;
      s.order.forEach((id,i)=>{fs.slots[i]=id;}); s.forged.forEach(id=>fs.accused.add(id)); appraise(); }
    else if(screen==="wall" && fs.result==="win"){ afterWall(); }
    else if(screen==="reward"){ rewardOffer[0]?takeReward(rewardOffer[0].id):skipReward(); enterWall(); }
    else break;
  }
  console.assert(SAVE.patronage===p0 && SAVE.bestWall===b0,
    "practice run must not bank Patronage or bestWall");

  SAVE=JSON.parse(savedSave); chosenCurator=savedCur; chosenStake=savedStake; saveMeta();
  screen="title"; overWin=false;
  console.table(rows); console.log("self-check done");
}
function simRun(){
  SAVE=defaultSave(); chosenCurator="standard";
  newRun("simrun"); RUN.practice=false;   // a scoring run, but on a fixed seed for the check
  let guard=40; const seen=[];
  while(screen!=="over" && guard-->0){
    if(screen==="wall" && !fs.over){
      const sol=fs.puz.solution;
      fs.puz.paintings.forEach(p=>seen.push(p.id));
      sol.order.forEach((id,i)=>{ fs.slots[i]=id; });
      sol.forged.forEach(id=>fs.accused.add(id));
      appraise();
    } else if(screen==="wall" && fs.over && fs.result==="win"){ afterWall(); }
    else if(screen==="reward"){ (rewardOffer[0]?takeReward(rewardOffer[0].id):skipReward()); enterWall(); }
    else break;
  }
  return { over:screen==="over"&&overWin, repMax:RUN.repMax, coin:RUN.coin,
           patronage:SAVE.patronage, bestWall:SAVE.bestWall,
           noRepeats: seen.length===new Set(seen).size, worksSeen:seen.length };
}
// ============================================================ balance harness (#balance)
// Models a PERFECT deducer: fairReveals(puz, staffGivens) = the minimum facts
// such a player must still buy. If that fits their Scrutiny, they clean-clear
// with no reputation cost. High clean-clear % across walls ⇒ the wall is too easy.
function wallSpecFor(w, stake, minF){
  let spec = WALLS[w];
  for(let s=0;s<stake;s++) if(STAKES[s] && STAKES[s].wall) spec = STAKES[s].wall(spec, w);
  if(minF) spec = {...spec, f:Math.max(spec.f, minF)};
  return spec;
}
function balanceReport(opts){
  opts = Object.assign({scrutiny:4, stake:0, minForgery:0, seeds:80, upgrades:0}, opts);
  const perWall = WALLS.map(()=>({need:[], clean:0, n:0, fb:0}));
  for(let si=0; si<opts.seeds; si++){
    const seed="bal"+si;
    RAND=mulberry32(hashSeed(seed)); const deck=shuffle(POOL); let pos=0;
    for(let w=0; w<WALLS.length; w++){
      const base=wallSpecFor(w, opts.stake, opts.minForgery);
      const spec={...base, works:deck.slice(pos,pos+base.n)}; pos+=base.n;
      RAND=mulberry32(hashSeed(seed+"#w"+w+"s"+opts.stake));
      let puz; try{ puz=makePuzzle(spec); }catch(e){ continue; }
      const bp = puz.fixed ? (()=>{ const m={}; puz.solution.order.forEach((id,k)=>m[id]=k); return m; })() : null;
      const need=fairReveals(puz, null, bp);   // Scrutiny to solve, not fact count
      const scr=opts.scrutiny + (w<2?1:0) + (puz.fixed?2:0) + opts.upgrades*1;   // wall 1-2 & finale ease + any scrutinyUp
      const rec=perWall[w]; rec.n++;
      rec.need.push(need===Infinity?99:need);
      if(need<=scr) rec.clean++;
      if(base.rooms && !puz.rooms) rec.fb++;
    }
  }
  const rows=perWall.map((r,i)=>{
    const ns=r.need.filter(x=>x<99).sort((a,b)=>a-b);
    return { wall:i+1, n:r.n,
             cleanPct: r.n?Math.round(100*r.clean/r.n):0,
             needMed: ns.length?ns[ns.length>>1]:"-",
             needMax: ns.length?ns[ns.length-1]:"-",
             unfair: r.need.filter(x=>x>=99).length,
             roomFallback: r.fb };
  });
  const hdr = `=== scrutiny ${opts.scrutiny}${opts.upgrades?"+"+opts.upgrades:""} · stake ${opts.stake} · ${opts.seeds} seeds ===`;
  const lines = rows.map(r=>`  wall ${r.wall}: clean ${String(r.cleanPct).padStart(3)}%  needMed ${r.needMed}  needMax ${r.needMax}  unfair ${r.unfair}  fb ${r.roomFallback}`);
  const mean = Math.round(rows.reduce((a,r)=>a+r.cleanPct,0)/rows.length);
  console.log("\n"+hdr+"\n"+lines.join("\n")+`\n  MEAN clean-clear (perfect play): ${mean}%`);
  return {hdr, rows, mean};
}
// -- run survival: play a PERFECT deducer through a whole run, tracking reputation.
// Reveals greedily up to Scrutiny; buys up to 2 more with reputation if that finishes
// the wall; otherwise guesses the forced-logic remainder (each wrong guess −1 rep,
// no hint). Reports the share of runs that reach Wall 8 alive.
function simSurvival(opts){
  opts = Object.assign({scrutiny:4, easyWalls:2, upgrades:0, startRep:5, label:"",
                        staffReveals:0, stake:0, minForgery:0, catFree:0, seeds:120, accum:false}, opts);
  let wins=0, repLeft=[]; const deathWall={};
  for(let si=0; si<opts.seeds; si++){
    const seed="surv"+si;
    RAND=mulberry32(hashSeed(seed)); const deck=shuffle(POOL); let pos=0;
    let rep=opts.startRep + (opts.stake>=2?1:0), dead=0;   // small buffer once Stakes get heavy
    for(let w=0; w<WALLS.length; w++){
      // accum models a realistically-drafted run: kit trickles in over the walls
      // constraint-staff each shave ~0.5 of a reveal; model a drafted run as +1 reveal from ~wall 3
      const staffReveals = opts.accum ? (w>=3?1:0) : (opts.staffReveals||0);
      const upg   = opts.accum ? (w>=2?1:0) : opts.upgrades;
      const cat   = opts.accum ? (w>=5?1:0) : opts.catFree;
      const base=wallSpecFor(w, opts.stake, opts.minForgery);
      const spec={...base, works:deck.slice(pos,pos+base.n)}; pos+=base.n;
      RAND=mulberry32(hashSeed(seed+"#w"+w+"s"+opts.stake));
      let puz; try{ puz=makePuzzle(spec); }catch(e){ continue; }
      const ids=[...puz.P.keys()], order=puz.solution.order, solF=new Set(puz.solution.forged);
      const gNat={}, gPos={};
      if(puz.fixed) order.forEach((id,k)=>gPos[id]=k);   // fixed wall: the board is given
      for(let c=0;c<staffReveals;c++){ if(RAND()<0.5){ const id=order.find(x=>!(x in gNat)); if(id) gNat[id]=solF.has(id)?"f":"g"; } }
      for(let c=0;c<cat;c++){ const id=order.find(x=>!(x in gNat)); if(id) gNat[id]=solF.has(id)?"f":"g"; }
      let natN=0;
      const revealNext=r=>{
        const aN=ids.find(x=>!(x in gNat)&&r.nat[x].size>1);
        if(aN){ gNat[aN]=solF.has(aN)?"f":"g"; const c=natN===0?1:2; natN++; return c; }
        const aP=ids.find(x=>!(x in gPos)&&r.pos[x].size>1);
        if(aP){ gPos[aP]=order.indexOf(aP); return 1; }
        return 0;
      };
      const budget=opts.scrutiny + (w<opts.easyWalls?1:0) + (puz.fixed?2:0) + upg;
      let used=0, r=propSolve(puz,gNat,gPos);
      while(!r.solved && used<budget){ const c=revealNext(r); if(!c) break; used+=c; r=propSolve(puz,gNat,gPos); }
      let buys=0;
      while(!r.solved && buys<2 && rep>1){ const c=revealNext(r); if(!c) break; rep--; buys++; used+=c; r=propSolve(puz,gNat,gPos); }
      if(r.solved){ continue; }   // wall cleared, no reputation lost
      const amb=ids.filter(x=>r.pos[x].size>1||r.nat[x].size>1).length;
      const pWin=Math.pow(0.55, Math.max(1,amb));   // rough model of guessing the forced-logic remainder
      let ok=false;
      while(!ok){ if(rep<=0){ dead=w+1; break; } if(RAND()<pWin) ok=true; else rep--; }
      if(dead) break;
    }
    if(dead){ deathWall[dead]=(deathWall[dead]||0)+1; }
    else { wins++; repLeft.push(rep); }
  }
  const winPct=Math.round(100*wins/opts.seeds);
  const avgRep=repLeft.length?(repLeft.reduce((a,b)=>a+b,0)/repLeft.length).toFixed(1):"-";
  const deaths=Object.keys(deathWall).sort((a,b)=>a-b).map(k=>`w${k}:${deathWall[k]}`).join(" ");
  console.log(`  ${opts.label||("startRep "+opts.startRep)} · scr ${opts.scrutiny} · stake ${opts.stake}${opts.accum?" · drafted":""} · ${opts.seeds} seeds`);
  console.log(`    → reach Wall 8 alive: ${winPct}%   avg reputation left: ${avgRep}   deaths: ${deaths||"none"}`);
  return {winPct, avgRep};
}
function balanceSuite(n){
  n = n || 24;
  console.log("--- per-wall clean-clear by a perfect deducer (lower=harder) ---");
  balanceReport({seeds:n});
  balanceReport({stake:4, seeds:Math.min(n,16)});
}
// ============================================================ dev console
// Press ` or ~ for an in-game console, or use window.dev from the browser console.
// dev.rep(9) · dev.win() · dev.inf() · dev.staff("intern") · dev.set("fs.scrutiny",20) · dev.help()
function devResolve(path){
  const roots={RUN, fs, SAVE, DEV};
  let parts=String(path).split("."), obj;
  if(parts[0] in roots){ obj=roots[parts[0]]; parts=parts.slice(1); }
  else obj=RUN;                                   // bare name → RUN.<name>
  for(let i=0;i<parts.length-1;i++) obj=obj[parts[i]];
  return {obj, key:parts[parts.length-1]};
}
const devVal=s=> s==="true"?true : s==="false"?false : s==="null"?null
  : (s!=="" && s!=null && !isNaN(+s)) ? +s : s;
const DEVCMD={
  help:()=>[
    "set <path> <val>   e.g. set fs.scrutiny 20 · set RUN.coin 999 · set SAVE.patronage 500",
    "get <path>",
    "rep N · coin N · scrutiny N · patronage N · wall N (jump)",
    "win · winrun · lose · reveal (show answer) · solve (lay it out, no appraise)",
    "inf [on|off]  — free investigations, free buys, no reputation cost, unlimited",
    "staff X · upgrade X · item X [n] · facility <id> <L> [basic|alt]",
    "stake N · stakes (unlock all) · curator X · known [N|all] · seed X (restart)",
    "reset — wipe the save (tutorial grant included) and reload",
    "staff:   intern aide ledger docent guard registrar",
    "upgrade: scrutinyUp firstFree surveyWide provExact provFree",
    "item:    rake ledger coffee opinion",
  ].join("\n"),
  set:(p,v)=>{ const {obj,key}=devResolve(p); obj[key]=devVal(v); render(); return `${p} = ${JSON.stringify(obj[key])}`; },
  get:(p)=>{ const {obj,key}=devResolve(p); return `${p} = ${JSON.stringify(obj[key])}`; },
  rep:n=>{ RUN.rep=+n; RUN.repMax=Math.max(RUN.repMax,+n); render(); return "reputation "+n; },
  coin:n=>{ RUN.coin=+n; render(); return "coin "+n; },
  gold:n=>DEVCMD.coin(n),
  scrutiny:n=>{ fs.scrutiny=+n; render(); return "scrutiny "+n; },
  scr:n=>DEVCMD.scrutiny(n),
  patronage:n=>{ SAVE.patronage=+n; saveMeta(); render(); return "patronage "+n; },
  reset:()=>{ try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    SAVE=defaultSave(); saveMeta(); location.reload(); return "save wiped — reloading"; },
  wall:n=>{ RUN.wall=Math.max(0,Math.min(WALLS.length-1,+n-1)); enterWall(); return "→ wall "+(RUN.wall+1); },
  win:()=>{ if(screen!=="wall"||fs.over) return "not on a live wall";
    const s=fs.puz.solution; if(!fs.puz.fixed) s.order.forEach((id,i)=>{fs.slots[i]=id;});
    fs.accused=new Set(s.forged); appraise(); return fs.result==="win"?"wall won":"appraise: "+fs.result; },
  winrun:()=>{ let g=25; while(screen!=="over"&&g-->0){
      if(screen==="wall"&&!fs.over) DEVCMD.win();
      else if(screen==="wall"&&fs.over&&fs.result==="win") afterWall();
      else if(screen==="reward"){ (rewardOffer[0]?takeReward(rewardOffer[0].id):skipReward()); enterWall(); }
      else break; } return "advanced — screen: "+screen; },
  lose:()=>{ if(fs&&!fs.over){ RUN.rep=0; lose(); } return "run ended"; },
  reveal:()=>{ const s=fs.puz.solution, F=new Set(s.forged);
    s.order.forEach(id=>{ fs.reveals[id]=F.has(id)?"f":"g"; }); render();
    return "TRUE HANG — "+s.order.map((id,i)=>`${i+1}:${fs.puz.P.get(id).title}${F.has(id)?" ✗FAKE":""}`).join("  "); },
  solve:()=>{ const s=fs.puz.solution; if(!fs.puz.fixed) s.order.forEach((id,i)=>{fs.slots[i]=id;});
    fs.accused=new Set(s.forged); render(); return "laid out (not appraised)"; },
  inf:st=>{ DEV.inf = st===undefined ? !DEV.inf : /^(on|true|1)$/i.test(st);
    if(DEV.inf && fs && !fs.over) fs.scrutiny=Math.max(fs.scrutiny,99);
    render(); return "infinite mode "+(DEV.inf?"ON":"OFF"); },
  staff:x=>{ if(!REWARDS.some(r=>r.id===x&&r.type==="staff")) return "no staff '"+x+"'";
    if(!RUN.staff.includes(x)) RUN.staff.push(x); render(); return "hired "+x; },
  upgrade:x=>{ if(!REWARDS.some(r=>r.id===x&&r.type==="upgrade")) return "no upgrade '"+x+"'";
    RUN.upgrades.add(x); if(x==="scrutinyUp"){ RUN.scrutinyBase++; RUN.scrutinyUpCount=(RUN.scrutinyUpCount||0)+1; }
    render(); return "gained "+x; },
  item:(x,n)=>{ if(!CONSUMABLES.some(c=>c.id===x)) return "no item '"+x+"'";
    for(let i=0;i<(+n||1);i++) RUN.items.push(x); render(); return `+${+n||1} ${x}`; },
  facility:(id,l,fk)=>{ if(!FACILITIES.some(f=>f.id===id)) return "facilities: "+FACILITIES.map(f=>f.id).join(" ");
    SAVE.facilities[id]={level:Math.max(0,Math.min(3,+l||0)), fork:(fk==="alt"?"alt":"basic")};
    saveMeta(); return `${id} → L${SAVE.facilities[id].level} ${SAVE.facilities[id].fork} (next run)`; },
  stake:n=>{ chosenStake=Math.max(0,Math.min(STAKES.length,+n)); SAVE.stake=chosenStake;
    SAVE.maxStake=Math.max(SAVE.maxStake||0,chosenStake); saveMeta(); return "stake "+chosenStake+" (next run)"; },
  stakes:()=>{ SAVE.maxStake=STAKES.length; saveMeta(); return "all stakes unlocked"; },
  curator:x=>{ if(!CURATORS[x]) return "curators: "+Object.keys(CURATORS).join(" ");
    chosenCurator=x; SAVE.curator=x; saveMeta(); return "curator "+x+" (next run)"; },
  known:n=>{ SAVE.known = n==="all" ? POOL.map(p=>p.id) : POOL.slice(0,+n||0).map(p=>p.id);
    saveMeta(); return "SAVE.known: "+SAVE.known.length; },
  seed:x=>{ newRun(String(x==null?"":x)); return "new run — seed "+RUN.seed; },
};
function devRun(line){
  line=String(line||"").trim(); if(!line) return "";
  const [cmd,...args]=line.split(/\s+/);
  if(!DEVCMD[cmd]) return devLog("? '"+cmd+"' — try help");
  try{ return devLog(DEVCMD[cmd](...args)); }catch(e){ return devLog("err: "+e.message); }
}
let _devOutBuf=[];
function devLog(msg){
  if(msg==null) msg="ok";
  _devOutBuf.push(String(msg)); if(_devOutBuf.length>40) _devOutBuf.shift();
  const o=document.querySelector("#devpanel .devout");
  if(o){ o.textContent=_devOutBuf.join("\n"); o.scrollTop=o.scrollHeight; }
  return msg;
}
window.dev=new Proxy(DEVCMD,{ get:(t,p)=> p==="run" ? devRun : (p in t ? (...a)=>{const r=t[p](...a); console.log(r); return r;} : undefined) });

// ---- dev GUI panel ----------------------------------------------------------
(function(){
  const S=document.createElement("style");
  S.textContent=`
  #devpanel{position:fixed;top:0;right:0;bottom:0;width:300px;z-index:6000;overflow-y:auto;
    background:#15100af7;border-left:2px solid var(--brass);color:#e9ddc1;
    font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px 40px;box-shadow:-14px 0 34px -12px #000}
  #devpanel h4{margin:14px 0 6px;font:600 11px var(--body);letter-spacing:1.5px;text-transform:uppercase;color:var(--brass)}
  #devpanel h4:first-child{margin-top:0}
  #devpanel button{background:#0005;border:1px solid #ffffff26;color:inherit;font:inherit;
    padding:4px 8px;border-radius:3px;cursor:pointer;margin:2px 3px 2px 0}
  #devpanel button:hover{background:#ffffff1a}
  #devpanel button.on{background:var(--brass);border-color:var(--brass);color:#1c140a;font-weight:700}
  #devpanel input,#devpanel select{background:#0006;border:1px solid #ffffff26;color:inherit;font:inherit;
    padding:3px 5px;border-radius:3px}
  #devpanel input[type=number]{width:58px}
  #devpanel label{display:flex;align-items:center;gap:6px;margin:3px 0}
  #devpanel .row{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
  #devpanel .devout{max-height:120px;overflow:auto;white-space:pre-wrap;opacity:.85;
    border-top:1px solid #ffffff1f;margin-top:8px;padding-top:6px;font-size:11.5px}
  #devtab{position:fixed;top:8px;right:8px;z-index:5999;background:#15100af0;border:1px solid var(--brass);
    color:var(--brass);font:600 10px var(--body);letter-spacing:1px;padding:4px 8px;border-radius:3px;cursor:pointer}`;
  document.head.appendChild(S);

  // no visible entry point — the panel opens only via the ` / ~ key or window.dev
  let panel=null;
  const num=(label,path)=>{
    const {obj,key}=devResolve(path), r=el(`<label>${label}<input type="number" value="${obj[key]}"></label>`);
    r.querySelector("input").onchange=e=>{ DEVCMD.set(path, e.target.value); paint(); };
    return r;
  };
  const btn=(label,fn)=>{ const b=el(`<button>${label}</button>`); b.onclick=()=>{ fn(); paint(); }; return b; };
  const chip=(label,active,fn)=>{ const b=el(`<button class="${active?'on':''}">${label}</button>`); b.onclick=()=>{ fn(); paint(); }; return b; };
  const sect=(t)=>el(`<h4>${t}</h4>`);

  function paint(){
    if(!panel) return;
    const foc=document.activeElement, focCmd=foc&&foc.classList.contains("devin");
    panel.innerHTML="";
    const add=(...n)=>n.forEach(x=>panel.appendChild(x));
    const live = RUN && fs;

    const hdr=el(`<div class="row" style="justify-content:space-between;position:sticky;top:-10px;background:#15100a;padding:4px 0;margin:-2px 0 4px">
      <b style="color:var(--brass);letter-spacing:1px">DEV TOOLS</b><button style="font-weight:700">✕ close  (~)</button></div>`);
    hdr.querySelector("button").onclick=toggle;
    add(hdr);

    add(sect("Reputation & coin"));
    if(live){
      const g=el(`<div class="row"></div>`);
      g.append(num("rep","RUN.rep"), num("cap","RUN.repMax"), num("coin","RUN.coin"));
      add(g);
      const g2=el(`<div class="row"></div>`);
      g2.append(num("scrutiny","fs.scrutiny"), num("patronage","SAVE.patronage"));
      add(g2);
    } else add(el(`<div style="opacity:.6">start a run first</div>`));

    add(sect("This wall"));
    if(live && screen==="wall"){
      const g=el(`<div class="row"></div>`);
      g.append(btn("Win wall",()=>DEVCMD.win()), btn("Solve (lay out)",()=>DEVCMD.solve()),
               btn("Reveal answer",()=>DEVCMD.reveal()), btn("Win whole run",()=>DEVCMD.winrun()),
               btn("Lose run",()=>DEVCMD.lose()));
      add(g);
      const jw=el(`<div class="row">jump: </div>`);
      WALLS.forEach((_,i)=> jw.appendChild(chip(""+(i+1), RUN.wall===i, ()=>DEVCMD.wall(i+1))));
      add(jw);
    } else add(el(`<div style="opacity:.6">(available on a wall)</div>`));

    add(sect("Toggles"));
    add(chip("INFINITE  (free everything, no rep cost)", DEV.inf, ()=>DEVCMD.inf()));

    add(sect("Staff"));
    const sf=el(`<div class="row"></div>`);
    REWARDS.filter(r=>r.type==="staff").forEach(r=>{
      const has = live && RUN.staff.includes(r.id);
      sf.appendChild(chip(r.id, has, ()=>{ if(!live) return;
        if(has) RUN.staff.splice(RUN.staff.indexOf(r.id),1); else DEVCMD.staff(r.id); render(); }));
    });
    add(sf);

    add(sect("Upgrades"));
    const up=el(`<div class="row"></div>`);
    REWARDS.filter(r=>r.type==="upgrade").forEach(r=>{
      const has = live && RUN.upgrades.has(r.id);
      up.appendChild(chip(r.id, has, ()=>{ if(!live) return;
        if(has) RUN.upgrades.delete(r.id); else DEVCMD.upgrade(r.id); render(); }));
    });
    add(up);

    add(sect("Consumables  (adds to bag)"));
    const cs=el(`<div class="row"></div>`);
    CONSUMABLES.forEach(c=> cs.appendChild(btn("+ "+c.id, ()=>DEVCMD.item(c.id,1))));
    add(cs);

    add(sect("Meta  (applies next run)"));
    const cur=el(`<label>curator <select></select></label>`);
    Object.keys(CURATORS).forEach(k=>{ const o=el(`<option ${chosenCurator===k?"selected":""}>${k}</option>`); cur.querySelector("select").appendChild(o); });
    cur.querySelector("select").onchange=e=>{ DEVCMD.curator(e.target.value); paint(); };
    add(cur);
    const stk=el(`<label>stake <select></select></label>`);
    for(let i=0;i<=STAKES.length;i++){ const o=el(`<option ${chosenStake===i?"selected":""}>${i}</option>`); stk.querySelector("select").appendChild(o); }
    stk.querySelector("select").onchange=e=>{ DEVCMD.stake(e.target.value); paint(); };
    add(stk, btn("unlock all stakes",()=>DEVCMD.stakes()), btn("know every piece",()=>DEVCMD.known("all")));
    FACILITIES.forEach(f=>{
      const st=(SAVE.facilities[f.id]||{level:0,fork:"basic"});
      const row=el(`<div class="row">${f.id} <select class="lv"></select><select class="fk"><option ${st.fork==="basic"?"selected":""}>basic</option><option ${st.fork==="alt"?"selected":""}>alt</option></select></div>`);
      [0,1,2,3].forEach(l=> row.querySelector(".lv").appendChild(el(`<option ${st.level===l?"selected":""}>${l}</option>`)));
      const apply=()=>{ DEVCMD.facility(f.id, row.querySelector(".lv").value, row.querySelector(".fk").value); paint(); };
      row.querySelector(".lv").onchange=apply; row.querySelector(".fk").onchange=apply;
      add(row);
    });

    add(sect("New run"));
    const nr=el(`<div class="row"><input class="seed" placeholder="seed (blank=random)" style="flex:1"><button>Start</button></div>`);
    nr.querySelector("button").onclick=()=>{ DEVCMD.seed(nr.querySelector(".seed").value); paint(); };
    add(nr);
    add(btn("run tutorial", ()=>{ startTutorial(); }),
        btn("full reset (wipe save + tutorial)", ()=>DEVCMD.reset()));

    add(sect("Console"));
    const con=el(`<div><div class="devout"></div><div class="row"><span style="color:var(--brass)">dev&gt;</span><input class="devin" style="flex:1" placeholder="type 'help'"></div></div>`);
    con.querySelector(".devout").textContent=_devOutBuf.join("\n");
    const inp=con.querySelector(".devin");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=inp.value; if(v.trim()){ devLog("dev> "+v); devRun(v); } inp.value=""; paint(); }});
    add(con);
    if(focCmd) panel.querySelector(".devin").focus();
  }
  function toggle(){
    if(panel){ panel.remove(); panel=null; return; }
    panel=el(`<div id="devpanel"></div>`); document.body.appendChild(panel);
    paint();
  }
  window.addEventListener("keydown",e=>{
    if((e.key==="`"||e.key==="~") && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target||{}).tagName||"")){ e.preventDefault(); toggle(); }
  });
  // keep the panel fresh when the game re-renders (unless you're mid-edit in it)
  const _render=render;
  render=function(){ _render.apply(this,arguments);
    const f=document.activeElement;
    if(panel && !(f && panel.contains(f) && /^(INPUT|SELECT)$/.test(f.tagName))) paint();
  };
})();

// #balance = the fast per-wall report.  #balancesurv = the slow full-run survival sim.

} else if(location.hash.indexOf("#balance")===0){
  const m=location.hash.match(/\d+/); balanceSuite(m?+m[0]:24);
